[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-advisor-rag"
version = "0.2.0"
description = "Contract Q&A with persistent ingestion, hybrid retrieval and verifiable citations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pypdf>=5,<7", "python-dotenv>=1,<2", "openai>=3.31,<4",
  "python-multipart>=0.0.20,<1", "socksio>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
rerank = ["sentence-transformers>=5,<6"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["docs/legacy/evaluation_result.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
